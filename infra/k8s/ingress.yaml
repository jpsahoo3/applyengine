apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: applyengine-ingress
  namespace: applyengine
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: applyengine-api
                port:
                  number: 8000
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: applyengine-frontend
                port:
                  number: 3000

