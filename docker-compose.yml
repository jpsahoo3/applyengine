version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env.example
    environment:
      PYTHONPATH: /app/backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: ["python", "-m", "applyengine.main"]

  scraping-worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env.example
    environment:
      PYTHONPATH: /app/backend
      WORKER_POOL: scraping-workers
    depends_on:
      - api
      - redis
    command: ["python", "-m", "applyengine.main"]

  ai-worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env.example
    environment:
      PYTHONPATH: /app/backend
      WORKER_POOL: ai-workers
    depends_on:
      - api
      - redis
    command: ["python", "-m", "applyengine.main"]

  application-worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env.example
    environment:
      PYTHONPATH: /app/backend
      WORKER_POOL: application-workers
    depends_on:
      - api
      - redis
    command: ["python", "-m", "applyengine.main"]

  outreach-worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env.example
    environment:
      PYTHONPATH: /app/backend
      WORKER_POOL: outreach-workers
    depends_on:
      - api
      - redis
    command: ["python", "-m", "applyengine.main"]

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: applyengine
      POSTGRES_USER: applyengine
      POSTGRES_PASSWORD: applyengine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:

